name: Daily Verse Reminder

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 Lagos time
  workflow_dispatch:       # also lets you trigger it manually

jobs:
  send-daily-verse:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily verse push
        run: |
          curl -fsS --max-time 280 \
            -X POST \
            "https://mypersonal-bible-app.onrender.com/api/push/send?token=${{ secrets.APP_PUSH_TOKEN }}" \
          || echo "Push request failed (app may be asleep or token missing) - will retry tomorrow"
