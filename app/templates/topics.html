<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Prevent theme flash on page load - MUST be first -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('bibleAppTheme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bible verses by topic - love, faith, hope, peace, strength, healing, wisdom and more. Curated Scripture collections for every season of life.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Bible Topics - MyPersonal Bible">
    <meta property="og:description" content="Curated Scripture collections for every season of life.">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image" content="{{ url_for('static', filename='img/app-icon.jpg', _external=True) }}">
    <link rel="canonical" href="{{ request.url }}">
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/app-icon.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/app-icon.jpg') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#3d2205">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Bible Topics - MyPersonal Bible</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Lora:wght@500&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        .topic-card {
            cursor: pointer;
            border-radius: 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            height: 100%;
        }
        .topic-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(26, 15, 0, 0.16);
        }
        [data-theme="dark"] .topic-card:hover { box-shadow: 0 18px 44px rgba(0, 0, 0, 0.6); }
        .topic-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--bg-tertiary);
            color: var(--accent-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }
        .verse-row {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-primary);
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 14px;
        }
        .verse-actions {
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }
        .verse-row:hover .verse-actions { opacity: 1; }
        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }
        .icon-btn:hover {
            background: var(--accent-text);
            color: var(--accent-contrast);
            border-color: var(--accent-text);
        }
        #topicDetail { display: none; }
        #topicDetail.open { display: block; }
        @media (max-width: 575px) {
            .verse-row { padding: 12px 14px; }
            .verse-quote { font-size: 1.05rem; line-height: 1.7; }
            .topic-card { padding: 12px !important; }
            .topic-card h6 { font-size: 0.9rem; }
            .topic-icon { width: 42px; height: 42px; font-size: 1.05rem; }
        }
    
        /* Cinzel display headings (matches the landing page identity) */
        .navbar-brand, .page-header h1, .section-title, .hero h1, h1.display-font {
            font-family: 'Cinzel', 'Lora', serif !important;
            letter-spacing: 0.02em;
        }

</style>
</head>
<body>

    {% include '_welcome_modal.html' %}
    {% include '_nav.html' %}

    <main style="padding-top: 76px;">
        <div class="page-header reveal">
            <div class="container">
                <h1><i class="fas fa-lightbulb me-2"></i>Bible Topics</h1>
                <p class="mt-3">Curated Scripture collections for every season of life — love, faith, hope, healing and more.</p>
            </div>
        </div>

        <div class="container col-11 py-5">
            <!-- Topic grid -->
            <div class="row g-4 reveal" id="topicGrid"></div>

            <!-- Topic detail -->
            <div id="topicDetail">
                <button class="btn btn-outline-secondary btn-sm mb-4" id="backToTopicsBtn">
                    <i class="fas fa-arrow-left me-1"></i>All Topics
                </button>
                <div class="card p-4">
                    <div class="d-flex align-items-center mb-2 gap-3">
                        <div class="topic-icon" id="topicDetailIcon"><i class="fas fa-book"></i></div>
                        <div>
                            <h3 class="mb-0" style="font-family: 'Lora', serif;" id="topicDetailTitle"></h3>
                            <small class="text-muted" id="topicDetailCount"></small>
                        </div>
                    </div>
                    <p class="text-muted mb-4" id="topicDetailDesc"></p>
                    <div id="topicVerses"></div>
                </div>
            </div>
        </div>
    </main>

    {% include '_footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app-common.js') }}"></script>
    <script>
        (function () {
            'use strict';
            const grid = document.getElementById('topicGrid');
            const detail = document.getElementById('topicDetail');
            let allTopics = [];

            function renderGrid() {
                grid.innerHTML = allTopics.map(function (t) {
                    return '<div class="col-6 col-md-4 col-lg-3">' +
                        '<div class="topic-card p-3" data-slug="' + t.slug + '">' +
                        '<div class="topic-icon mb-3"><i class="fas ' + t.icon + '"></i></div>' +
                        '<h6 class="mb-1" style="font-family: Lora, serif;">' + t.title + '</h6>' +
                        '<small class="text-muted">' + t.verse_count + ' verses</small>' +
                        '</div></div>';
                }).join('');
                grid.querySelectorAll('.topic-card').forEach(function (card) {
                    card.addEventListener('click', function () { openTopic(card.dataset.slug); });
                });
            }

            function openTopic(slug) {
                fetch('/api/topics/' + slug)
                    .then(function (res) { return res.json(); })
                    .then(function (topic) {
                        document.getElementById('topicDetailIcon').innerHTML = '<i class="fas ' + topic.icon + '"></i>';
                        document.getElementById('topicDetailTitle').textContent = topic.title;
                        document.getElementById('topicDetailCount').textContent = topic.verses.length + ' verses';
                        document.getElementById('topicDetailDesc').textContent = topic.description;
                        document.getElementById('topicVerses').innerHTML = topic.verses.map(function (v) {
                            return '<div class="verse-row d-flex gap-3">' +
                                '<div class="flex-grow-1">' +
                                '<div class="verse-quote">"' + v.text + '"</div>' +
                                '<div class="verse-ref mt-2">— ' + v.reference + '</div>' +
                                '</div>' +
                                '<div class="verse-actions d-flex flex-column gap-2">' +
                                '<button class="icon-btn share-topic-btn" data-ref="' + v.reference + '" data-text="' + v.text.replace(/"/g, '&quot;') + '" title="Share"><i class="fas fa-share-nodes"></i></button>' +
                                '<button class="icon-btn copy-topic-btn" data-ref="' + v.reference + '" data-text="' + v.text.replace(/"/g, '&quot;') + '" title="Copy"><i class="fas fa-copy"></i></button>' +
                                '</div>' +
                                '</div>';
                        }).join('');

                        document.querySelectorAll('.share-topic-btn').forEach(function (btn) {
                            btn.addEventListener('click', function () {
                                MPB.shareVerse(btn.dataset.ref, btn.dataset.text);
                            });
                        });
                        document.querySelectorAll('.copy-topic-btn').forEach(function (btn) {
                            btn.addEventListener('click', function () {
                                const t = btn.dataset.ref + ' - "' + btn.dataset.text + '"';
                                if (navigator.clipboard && navigator.clipboard.writeText) {
                                    navigator.clipboard.writeText(t).then(function () { MPB.showToast('Verse copied!', 'success'); });
                                }
                            });
                        });

                        grid.style.display = 'none';
                        detail.classList.add('open');
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    })
                    .catch(function () { MPB.showToast('Could not load topic', 'warning'); });
            }

            document.getElementById('backToTopicsBtn').addEventListener('click', function () {
                detail.classList.remove('open');
                grid.style.display = '';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            fetch('/api/topics')
                .then(function (res) { return res.json(); })
                .then(function (data) { allTopics = data.topics || []; renderGrid(); })
                .catch(function () { grid.innerHTML = '<p class="text-center text-muted">Could not load topics. Please refresh.</p>'; });
        })();
    </script>
</body>
</html>
