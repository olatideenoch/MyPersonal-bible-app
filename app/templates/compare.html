<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Prevent theme flash on page load - MUST be first -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('bibleAppTheme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compare Bible translations side by side. Read any chapter in two versions at once to deepen your understanding.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Compare Versions - MyPersonal Bible">
    <meta property="og:description" content="Compare Bible translations side by side.">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image" content="{{ url_for('static', filename='img/app-icon.jpg', _external=True) }}">
    <link rel="canonical" href="{{ request.url }}">
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/app-icon.jpg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/app-icon.jpg') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#3d2205">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Compare Versions - MyPersonal Bible</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Lora:wght@500&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        .compare-col {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }
        .compare-col-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            font-family: 'Lora', serif;
            border-radius: 16px 16px 0 0;
            background: var(--bg-tertiary);
            position: sticky;
            top: 70px;
            z-index: 5;
        }
        .compare-verse {
            display: flex;
            gap: 10px;
            padding: 8px 18px;
            font-size: 1.05rem;
            line-height: 1.7;
        }
        .compare-verse:nth-child(even) { background: rgba(201, 146, 58, 0.04); }
        [data-theme="dark"] .compare-verse:nth-child(even) { background: rgba(232, 184, 106, 0.07); }
        .compare-num {
            color: var(--accent-text);
            font-weight: 600;
            min-width: 26px;
            text-align: right;
            flex-shrink: 0;
        }
        .compare-missing {
            color: var(--text-muted);
            font-style: italic;
        }
        @media (max-width: 575px) {
            .compare-col-header { top: 58px; padding: 10px 14px; font-size: 0.95rem; }
            .compare-verse { padding: 6px 12px; font-size: 0.98rem; gap: 8px; }
            .compare-num { min-width: 22px; }
            #compareHeading { order: -1; width: 100%; text-align: center !important; font-size: 1.3rem; }
            #compareResult > .d-flex { flex-wrap: wrap; }
            .compare-col { max-height: none; }
            .compare-col .py-3 { max-height: 55vh !important; }
        }
        .swap-btn {
            border: none;
            background: var(--bg-tertiary);
            color: var(--accent-text);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .swap-btn:hover { background: var(--accent-text); color: var(--accent-contrast); }
    
        /* Cinzel display headings (matches the landing page identity) */
        .navbar-brand, .page-header h1, .section-title, .hero h1, h1.display-font {
            font-family: 'Cinzel', 'Lora', serif !important;
            letter-spacing: 0.02em;
        }

</style>
</head>
<body>

    {% include '_welcome_modal.html' %}
    {% include '_nav.html' %}

    <main style="padding-top: 76px;">
        <div class="page-header reveal">
            <div class="container">
                <h1><i class="fas fa-columns me-2"></i>Compare Versions</h1>
                <p class="mt-3">Read any chapter in two translations side by side — see how the Word speaks across versions.</p>
            </div>
        </div>

        <div class="container col-11 py-5">
            <!-- Controls -->
            <div class="card p-4 mb-4 reveal">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Book</label>
                        <select class="form-select" id="compareBook">
                            {% for book in books %}
                            <option value="{{ book.slug }}" data-chapters="{{ book.chapters }}">{{ book.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Chapter</label>
                        <select class="form-select" id="compareChapter"></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Version A</label>
                        <select class="form-select" id="compareV1">
                            {% for v in versions %}
                            <option value="{{ v.id }}" {% if v.id == 'en-kjv' %}selected{% endif %}>{{ v.version }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-1 d-none d-md-flex justify-content-center">
                        <button class="swap-btn" id="swapVersions" title="Swap versions"><i class="fas fa-right-left"></i></button>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Version B</label>
                        <select class="form-select" id="compareV2">
                            {% for v in versions %}
                            <option value="{{ v.id }}" {% if v.id == 'en-web' %}selected{% endif %}>{{ v.version }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-1 d-grid">
                        <button class="btn btn-primary" id="compareGoBtn"><i class="fas fa-search"></i></button>
                    </div>
                </div>
            </div>

            <!-- Result -->
            <div id="compareLoading" class="text-center py-5 d-none">
                <div class="spinner-border" style="color: var(--accent-primary);"></div>
                <p class="text-muted mt-3">Loading both translations...</p>
            </div>

            <div id="compareError" class="alert text-center d-none"></div>

            <div id="compareResult" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-outline-secondary btn-sm" id="comparePrev"><i class="fas fa-chevron-left me-1"></i>Prev</button>
                    <h4 class="mb-0 text-center" style="font-family: 'Lora', serif;" id="compareHeading"></h4>
                    <button class="btn btn-outline-secondary btn-sm" id="compareNext">Next<i class="fas fa-chevron-right ms-1"></i></button>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="compare-col">
                            <div class="compare-col-header d-flex justify-content-between align-items-center">
                                <span id="col1Title"></span>
                                <button class="icon-btn border-0" id="col1Copy" title="Copy chapter"><i class="fas fa-copy"></i></button>
                            </div>
                            <div class="py-3" id="col1Body" style="max-height: 70vh; overflow-y: auto;"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="compare-col">
                            <div class="compare-col-header d-flex justify-content-between align-items-center">
                                <span id="col2Title"></span>
                                <button class="icon-btn border-0" id="col2Copy" title="Copy chapter"><i class="fas fa-copy"></i></button>
                            </div>
                            <div class="py-3" id="col2Body" style="max-height: 70vh; overflow-y: auto;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    {% include '_footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app-common.js') }}"></script>
    <script>
        (function () {
            'use strict';
            const bookSelect = document.getElementById('compareBook');
            const chapterSelect = document.getElementById('compareChapter');
            let currentBook = bookSelect.value;
            let currentChapter = 1;

            function fillChapters() {
                const book = bookSelect.options[bookSelect.selectedIndex];
                const n = parseInt(book.dataset.chapters, 10);
                chapterSelect.innerHTML = '';
                for (let i = 1; i <= n; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = i;
                    chapterSelect.appendChild(opt);
                }
                chapterSelect.value = Math.min(currentChapter, n);
            }

            bookSelect.addEventListener('change', function () {
                currentBook = bookSelect.value;
                currentChapter = 1;
                fillChapters();
            });
            chapterSelect.addEventListener('change', function () { currentChapter = parseInt(chapterSelect.value, 10); });
            fillChapters();

            function verseRow(v) {
                return '<div class="compare-verse"><span class="compare-num">' + v.verse + '</span><span>' + v.text + '</span></div>';
            }

            function loadCompare() {
                const v1 = document.getElementById('compareV1').value;
                const v2 = document.getElementById('compareV2').value;
                const loading = document.getElementById('compareLoading');
                const error = document.getElementById('compareError');
                const result = document.getElementById('compareResult');
                loading.classList.remove('d-none');
                error.classList.add('d-none');
                result.classList.add('d-none');

                fetch('/api/compare/' + currentBook + '/' + currentChapter + '?v1=' + encodeURIComponent(v1) + '&v2=' + encodeURIComponent(v2))
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        loading.classList.add('d-none');
                        if (data.error) {
                            error.textContent = data.error;
                            error.classList.remove('d-none');
                            return;
                        }
                        currentBook = data.book_slug;
                        currentChapter = data.chapter;
                        document.getElementById('compareHeading').textContent = data.book + ' ' + data.chapter;
                        const a = data.versions[0], b = data.versions[1];
                        document.getElementById('col1Title').textContent = a.name;
                        document.getElementById('col2Title').textContent = b.name;
                        const maxV = Math.max(a.verses.length, b.verses.length);
                        let html1 = '', html2 = '';
                        for (let i = 0; i < maxV; i++) {
                            if (a.verses[i]) html1 += verseRow(a.verses[i]);
                            if (b.verses[i]) html2 += verseRow(b.verses[i]);
                        }
                        if (!a.verses.length) html1 = '<p class="text-center text-muted p-3">This version could not be loaded.</p>';
                        if (!b.verses.length) html2 = '<p class="text-center text-muted p-3">This version could not be loaded.</p>';
                        document.getElementById('col1Body').innerHTML = html1;
                        document.getElementById('col2Body').innerHTML = html2;
                        result.classList.remove('d-none');
                        window.scrollTo({ top: result.offsetTop - 90, behavior: 'smooth' });
                    })
                    .catch(function () {
                        loading.classList.add('d-none');
                        error.textContent = 'Could not load the comparison. Please check your connection and try again.';
                        error.classList.remove('d-none');
                    });
            }

            document.getElementById('compareGoBtn').addEventListener('click', function () {
                currentBook = bookSelect.value;
                currentChapter = parseInt(chapterSelect.value, 10) || 1;
                loadCompare();
            });

            document.getElementById('swapVersions').addEventListener('click', function () {
                const v1 = document.getElementById('compareV1');
                const v2 = document.getElementById('compareV2');
                const tmp = v1.value;
                v1.value = v2.value;
                v2.value = tmp;
                loadCompare();
            });

            document.getElementById('comparePrev').addEventListener('click', function () {
                if (currentChapter > 1) {
                    currentChapter--;
                    chapterSelect.value = currentChapter;
                    loadCompare();
                }
            });

            document.getElementById('compareNext').addEventListener('click', function () {
                const max = parseInt(bookSelect.options[bookSelect.selectedIndex].dataset.chapters, 10);
                if (currentChapter < max) {
                    currentChapter++;
                    chapterSelect.value = currentChapter;
                    loadCompare();
                }
            });

            function copyColumn(bodyId) {
                const text = Array.from(document.querySelectorAll('#' + bodyId + ' .compare-verse'))
                    .map(function (row) {
                        const num = row.querySelector('.compare-num').textContent;
                        const txt = row.lastChild.textContent.trim();
                        return num + ' ' + txt;
                    }).join('\n');
                if (!text) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function () { MPB.showToast('Chapter copied!', 'success'); });
                }
            }
            document.getElementById('col1Copy').addEventListener('click', function () { copyColumn('col1Body'); });
            document.getElementById('col2Copy').addEventListener('click', function () { copyColumn('col2Body'); });

            // Load a default comparison on first visit (John 1)
            document.getElementById('compareBook').value = 'john';
            currentBook = 'john';
            fillChapters();
            loadCompare();
        })();
    </script>
</body>
</html>
